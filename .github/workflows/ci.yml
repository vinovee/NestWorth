name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests and evals (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Evals in demo mode (no API key needed)
        run: npm run eval:mock
      - name: Audit dependencies
        run: npm audit --audit-level=high

  docker:
    name: Container builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t nestworth .
      - name: Start in demo mode and check health
        run: |
          docker run -d --name nestworth -p 8787:8787 -e LLM_PROVIDER=mock -e APP_ACCESS_TOKEN=ci-token-0123456789 nestworth
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8787/api/health && exit 0; sleep 1; done
          docker logs nestworth
          exit 1
