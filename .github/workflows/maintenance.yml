name: Maintenance

# Weekly health check: runs every check on the newest Node LTS, audits dependencies,
# and opens (or comments on) a "maintenance" issue when tax rules, AI defaults,
# the compliance mapping or the Node version are due for review.
# Dependabot handles package, GitHub Actions and Docker image updates separately.

on:
  schedule:
    - cron: '23 5 * * 1' # Mondays at 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: Weekly health check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Lint, types, tests and demo evals
        run: npm run check
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Check review dates
        id: review
        run: node scripts/maintenance.js --out review.md
      - name: Open or update the maintenance issue
        if: steps.review.outputs.overdue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create maintenance --color FBCA04 --description "Scheduled maintenance" --force
          number=$(gh issue list --label maintenance --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file review.md
          else
            gh issue create --title "Scheduled maintenance: facts to re-check" --label maintenance --body-file review.md
          fi
